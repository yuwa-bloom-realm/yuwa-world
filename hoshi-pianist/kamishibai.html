<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>星が降る夜のピアニスト｜紙芝居</title>
<meta name="description" content="桜庭ゆわの短編物語を、絵をめくりながら、文字で読む紙芝居で。">
<meta property="og:title" content="星が降る夜のピアニスト｜紙芝居">
<meta property="og:description" content="桜庭ゆわの短編物語を、絵をめくりながら、文字で読む紙芝居で。">
<meta property="og:image" content="images/img01.webp">
<style>
  :root{
    --paper:#f6efe2;
    --paper2:#efe4cf;
    --ink:#3b2f25;
    --soft:#7a6a58;
    --wood:#8a5a36;
    --wood2:#6e4426;
    --red:#c2557a;
    --hl:#fff3c4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(ellipse at top,#fbf6ec 0%,var(--paper) 55%,var(--paper2) 100%);
    color:var(--ink);
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
    -webkit-tap-highlight-color:transparent;
    overflow:hidden;
  }
  .app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:720px;margin:0 auto;
       padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

  /* ---------- 紙芝居の木枠 ---------- */
  .butai{
    position:relative;border-radius:10px;padding:10px;
    background:linear-gradient(135deg,var(--wood) 0%,var(--wood2) 100%);
    box-shadow:0 6px 18px rgba(60,35,15,.28), inset 0 0 0 2px rgba(255,255,255,.08);
  }
  .butai::before{content:"";position:absolute;inset:4px;border-radius:7px;border:1px solid rgba(255,230,190,.25);pointer-events:none}
  .stage{position:relative;overflow:hidden;border-radius:4px;background:#fdf9f1;aspect-ratio:16/9;max-height:42vh;margin:0 auto}
  .stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fdf9f1}
  .stage img.slide-out{animation:out .45s ease forwards}
  .stage img.slide-in{animation:in .45s ease forwards}
  .stage img.slide-out-r{animation:outr .45s ease forwards}
  .stage img.slide-in-r{animation:inr .45s ease forwards}
  @keyframes out{to{transform:translateX(-105%)}}
  @keyframes in{from{transform:translateX(105%)}to{transform:none}}
  @keyframes outr{to{transform:translateX(105%)}}
  @keyframes inr{from{transform:translateX(-105%)}to{transform:none}}

  /* ---------- 表紙 ---------- */
  #cover{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:18px 4px}
  .label{text-align:center;font-size:12px;letter-spacing:.3em;color:var(--soft)}
  .title{text-align:center;font-size:clamp(22px,6vw,30px);line-height:1.5;letter-spacing:.06em}
  .author{text-align:center;font-size:15px;color:var(--soft);letter-spacing:.2em}
  .btns{display:flex;flex-direction:column;gap:12px;align-items:center}
  .btn{width:min(320px,100%);padding:15px 18px;border-radius:999px;font-size:16px;letter-spacing:.08em;
       transition:transform .1s}
  .btn:active{transform:scale(.97)}
  .btn-main{background:var(--red);color:#fff;box-shadow:0 4px 12px rgba(194,85,122,.3)}
  .btn-sub{background:#fffaf0;border:1px solid #d8c7ab}
  .note{text-align:center;font-size:12px;color:var(--soft);line-height:1.7}

  /* ---------- 読む画面 ---------- */
  #reader{flex:1;display:none;flex-direction:column;min-height:0;gap:10px;padding-top:8px}
  .topbar{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--soft);min-height:38px}
  .topbar .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
  .pill{padding:7px 12px;border-radius:999px;background:#fffaf0;border:1px solid #d8c7ab;font-size:13px;white-space:nowrap}
  .pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .textbox{flex:1;min-height:0;overflow-y:auto;background:rgba(255,252,245,.85);border:1px solid #e3d5bd;border-radius:10px;
           padding:16px 18px;font-size:17px;line-height:2;letter-spacing:.03em;-webkit-overflow-scrolling:touch}
  .textbox .s{display:block;transition:background .3s;border-radius:4px;padding:1px 0}
  .textbox .s.ch{text-align:center;color:var(--red);letter-spacing:.15em;font-size:15px;margin:4px 0 10px}
  .textbox .s.now{background:var(--hl);box-shadow:0 0 0 2px var(--hl)}
  .textbox.end{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px}
  .owari{font-size:22px;letter-spacing:.2em}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:10px}
  .nav button{flex:1;padding:14px 0;border-radius:12px;font-size:16px;background:#fffaf0;border:1px solid #d8c7ab}
  .nav button:disabled{opacity:.35}
  .nav .count{flex:0 0 auto;font-size:14px;color:var(--soft);min-width:64px;text-align:center}
  .progress{height:3px;background:#e8dcc6;border-radius:3px;overflow:hidden}
  .progress i{display:block;height:100%;background:var(--red);width:0;transition:width .4s}
</style>
</head>
<body>
<div class="app">

  <!-- 表紙 -->
  <section id="cover">
    <div class="butai"><div class="stage"><img src="images/img01.webp" alt="表紙"></div></div>
    <div>
      <p class="label">ゆわ魔法図書館の紙芝居</p>
      <h1 class="title">星が降る夜のピアニスト</h1>
      <p class="author">桜庭ゆわ</p>
    </div>
    <div class="btns">
      <button class="btn btn-main" id="start">🎴 紙芝居をめくる</button>
    </div>
    <p class="note">絵をタップするか、左右にスワイプするとめくれます。<br>音は出ません。自分のペースで、ゆっくりどうぞ。</p>
  </section>

  <!-- 読む画面 -->
  <section id="reader">
    <div class="topbar">
      <span class="t">星が降る夜のピアニスト</span>
      <a class="pill" href="index.html" style="text-decoration:none;color:inherit">ほかの形式</a>
    </div>
    <div class="progress"><i id="bar"></i></div>
    <div class="butai"><div class="stage" id="stage"><img id="pic" alt=""></div></div>
    <div class="textbox" id="text"></div>
    <div class="nav">
      <button id="prev">◀ まえ</button>
      <span class="count" id="count"></span>
      <button id="next">つぎ ▶</button>
    </div>
  </section>

</div>

<script>
// 紙芝居は音声なし（絵と文章だけ）が標準
const PAGES = [{"img": "img02.webp", "alt": "丘の上の古い音楽堂", "lines": ["この街には、古くから不思議な言い伝えがある。", "星が流れる夜、丘の上の古い音楽堂から、ピアノの音が聞こえてくることがあるという。", "その音色を聴いた人は、忘れていた大切な何かを思い出す。", "けれど、誰が弾いているのかを知る人はいない。", "なぜなら、その音楽堂は、もう何十年も使われていないからだ。"]}, {"img": "img03.webp", "alt": "母と並んでピアノを弾く少女", "lines": ["#✦", "丘のふもとに、ひとりの少女が暮らしていた。", "少女は、ピアノが大好きだった。", "小さい頃は、母と並んで毎日のように弾いていた。", "母が右手を弾き、少女が左手を弾く。", "ときどき間違えて、二人で大笑いした。", "「もう！ お母さんが間違えたんでしょ！」", "「違うわよ。あなたが急ぐから！」", "そんな時間が、少女は大好きだった。"]}, {"img": "img04.webp", "alt": "誰もいない隣の椅子", "lines": ["けれど、母が亡くなった日から、少女はピアノを弾かなくなった。", "鍵盤に触れると、母の声が聞こえてくる気がした。", "隣を見ると、誰もいない。", "それが、たまらなく悲しかった。"]}, {"img": "img05.webp", "alt": "窓から音楽堂を見上げる少女", "lines": ["少女は、いつしか笑うことも少なくなっていた。", "そんなある夜のこと。", "丘の上から、ピアノの音が聞こえてきた。", "ポロン。", "ポロン、ポロ……ジャン！", "「……え？」", "少女は思わず足を止めた。", "なんともひどい演奏だった。", "同じところで何度も間違え、途中で止まり、また最初から弾き直している。", "「もう！ そこは違うってば！」", "思わず声が出た。", "すると、音がぴたりと止まった。", "少女は慌てて口を押さえた。"]}, {"img": "img06.webp", "alt": "下手な演奏で頭を抱える少年", "lines": ["誰もいないはずの音楽堂。", "気になって、そっと扉を開けた。", "そこには、一人の少年がいた。", "古びたグランドピアノの前に座り、難しい顔をして鍵盤をにらんでいる。", "「……誰？」", "少年が振り向いた。", "「あ！ よかった！ ちょうどいいところに来た！」", "「え？」", "「君、ピアノ弾ける？」", "「……昔は」", "「じゃあ、ここ教えて！」", "少年は楽譜を指さした。", "「どうしても、この先が弾けないんだ」", "少女は首を振った。", "「もう弾かないの」", "「どうして？」", "「……弾きたくないから」", "少年は少し考えてから言った。", "「そっか。じゃあ、聴いてて！」", "そして、また弾き始めた。", "ポロン、ポロン、ポロ……ジャン！", "「だから！ そこ違うってば！」", "「ええ！？ また！？」", "少年が大げさに頭を抱えた。"]}, {"img": "img07.webp", "alt": "久しぶりに笑った少女", "lines": ["その姿がおかしくて、少女は思わず吹き出した。", "「ふふっ……あはは！」", "少年は、ぽかんと少女を見つめた。", "そして、嬉しそうに笑った。", "「……やっと笑った」", "「え？」", "「ううん！ なんでもない！」"]}, {"img": "img08.webp", "alt": "二人だけの音楽堂", "lines": ["#✦", "それから少女は、毎晩のように音楽堂へ通うようになった。", "最初は、少年のあまりにもひどい演奏が気になっただけだった。", "けれど、いつしか二人で過ごす時間が楽しみになっていた。", "少年は、とにかくおしゃべりだった。", "「ねえ、雲って食べられると思う？」", "「食べられないでしょ」", "「でも綿あめに似てるじゃん！」", "「じゃあ、食べてみたら？」", "「高いところ苦手なんだよねえ」", "「なんなのよ！」", "少女は笑った。", "少年も笑った。", "ピアノを弾いて、くだらない話をして、またピアノを弾く。", "そんな毎日だった。"]}, {"img": "img09.webp", "alt": "秋の坂道と音楽堂", "lines": ["ある日、少女は尋ねた。", "「ねえ、どうしてそんなに一生懸命練習してるの？」", "少年は鍵盤に指を置いた const OPCHAT = "https://line.me/ti/g2/JLE5DC_IjliePPb9tKLrPhVyAReacddikiOvPw?utm_source=invitation&utm_medium=link_copy&utm_campaign=default";

const $ = id => document.getElementById(id);
let page = 0;
const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(dir){
  const p = PAGES[page];
  const img = $("pic");
  const newSrc = "images/"+p.img;
  if(dir && !img.src.endsWith(p.img)){
    const old = img.cloneNode(); old.removeAttribute("id");
    $("stage").appendChild(old);
    old.className = dir>0 ? "slide-out" : "slide-out-r";
    img.src = newSrc;
    img.className = dir>0 ? "slide-in" : "slide-in-r";
    setTimeout(()=>{ old.remove(); img.className=""; },460);
  }else{
    img.src = newSrc;
  }
  img.alt = p.alt || ((page+1)+"ページ目の絵");

  const box = $("text");
  box.scrollTop = 0;
  if(p.end){
    box.className="textbox end";
    box.innerHTML = '<p class="owari">―― おしまい ――</p><p>桜庭ゆわ</p>'+
      '<a class="btn btn-main" style="margin-top:8px;text-decoration:none;display:block;text-align:center" href="'+OPCHAT+'">📚 ゆわの魔法図書館に戻る</a>'+
      '<button class="btn btn-sub" id="again">はじめから読む</button>'+
      '<a class="btn btn-sub" style="text-decoration:none;display:block;text-align:center;color:inherit" href="index.html">ほかの形式で楽しむ</a>';
    $("again").onclick = ()=>{ go(0-page); };
  }else{
    box.className="textbox";
    box.innerHTML = p.lines.map(s=> s[0]==="#"
      ? '<span class="s ch">'+esc(s.slice(1))+'</span>'
      : '<span class="s">'+esc(s)+'</span>').join("");
  }
  $("count").textContent = (page+1)+" / "+PAGES.length;
  $("bar").style.width = ((page+1)/PAGES.length*100)+"%";
  $("prev").disabled = page===0;
  $("next").disabled = page===PAGES.length-1;
  if(PAGES[page+1]){ const pre=new Image(); pre.src="images/"+PAGES[page+1].img; }
}
function go(d){
  const n = page+d;
  if(n<0 || n>=PAGES.length) return;
  page = n;
  render(d>0?1:-1);
}
$("start").onclick = ()=>{
  $("cover").style.display="none";
  $("reader").style.display="flex";
  page = 0; render(0);
};
$("prev").onclick = ()=> go(-1);
$("next").onclick = ()=> go(1);
$("stage").onclick = ()=> go(1);
document.addEventListener("keydown",e=>{
  if($("reader").style.display!=="flex") return;
  if(e.key==="ArrowRight") go(1);
  if(e.key==="ArrowLeft") go(-1);
});
let sx=null, sy=null;
$("reader").addEventListener("touchstart",e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
$("reader").addEventListener("touchend",e=>{
  if(sx===null) return;
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5) go(dx<0?1:-1);
  sx=null;
},{passive:true});
</script>
