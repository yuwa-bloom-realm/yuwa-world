<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>レディーファースト｜紙芝居</title>
<meta name="description" content="桜庭ゆわの短編物語を、イラストとナレーションつきの紙芝居で。">
<meta property="og:title" content="レディーファースト｜紙芝居">
<meta property="og:description" content="桜庭ゆわの短編物語を、イラストとナレーションつきの紙芝居で。">
<meta property="og:image" content="images/img01.webp">
<style>
  :root{
    --paper:#f6efe2;
    --paper2:#efe4cf;
    --ink:#3b2f25;
    --soft:#7a6a58;
    --wood:#8a5a36;
    --wood2:#6e4426;
    --red:#c2557a;
    --hl:#fff3c4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(ellipse at top,#fbf6ec 0%,var(--paper) 55%,var(--paper2) 100%);
    color:var(--ink);
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
    -webkit-tap-highlight-color:transparent;
    overflow:hidden;
  }
  .app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:720px;margin:0 auto;
       padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

  /* ---------- 紙芝居の木枠 ---------- */
  .butai{
    position:relative;border-radius:10px;padding:10px;
    background:linear-gradient(135deg,var(--wood) 0%,var(--wood2) 100%);
    box-shadow:0 6px 18px rgba(60,35,15,.28), inset 0 0 0 2px rgba(255,255,255,.08);
  }
  .butai::before{content:"";position:absolute;inset:4px;border-radius:7px;border:1px solid rgba(255,230,190,.25);pointer-events:none}
  .stage{position:relative;overflow:hidden;border-radius:4px;background:#fdf9f1;aspect-ratio:3/2;max-height:46vh;margin:0 auto}
  .stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fdf9f1}
  .stage img.slide-out{animation:out .45s ease forwards}
  .stage img.slide-in{animation:in .45s ease forwards}
  .stage img.slide-out-r{animation:outr .45s ease forwards}
  .stage img.slide-in-r{animation:inr .45s ease forwards}
  @keyframes out{to{transform:translateX(-105%)}}
  @keyframes in{from{transform:translateX(105%)}to{transform:none}}
  @keyframes outr{to{transform:translateX(105%)}}
  @keyframes inr{from{transform:translateX(-105%)}to{transform:none}}

  /* ---------- 表紙 ---------- */
  #cover{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:18px 4px}
  .label{text-align:center;font-size:12px;letter-spacing:.3em;color:var(--soft)}
  .title{text-align:center;font-size:clamp(22px,6vw,30px);line-height:1.5;letter-spacing:.06em}
  .author{text-align:center;font-size:15px;color:var(--soft);letter-spacing:.2em}
  .btns{display:flex;flex-direction:column;gap:12px;align-items:center}
  .btn{width:min(320px,100%);padding:15px 18px;border-radius:999px;font-size:16px;letter-spacing:.08em;
       transition:transform .1s}
  .btn:active{transform:scale(.97)}
  .btn-main{background:var(--red);color:#fff;box-shadow:0 4px 12px rgba(194,85,122,.3)}
  .btn-sub{background:#fffaf0;border:1px solid #d8c7ab}
  .note{text-align:center;font-size:12px;color:var(--soft);line-height:1.7}

  /* ---------- 読む画面 ---------- */
  #reader{flex:1;display:none;flex-direction:column;min-height:0;gap:10px;padding-top:8px}
  .topbar{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--soft);min-height:38px}
  .topbar .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
  .pill{padding:7px 12px;border-radius:999px;background:#fffaf0;border:1px solid #d8c7ab;font-size:13px;white-space:nowrap}
  .pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .textbox{flex:1;min-height:0;overflow-y:auto;background:rgba(255,252,245,.85);border:1px solid #e3d5bd;border-radius:10px;
           padding:16px 18px;font-size:17px;line-height:2;letter-spacing:.03em;-webkit-overflow-scrolling:touch}
  .textbox .s{transition:background .3s;border-radius:4px;padding:1px 0}
  .textbox .s.now{background:var(--hl);box-shadow:0 0 0 2px var(--hl)}
  .textbox.end{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px}
  .owari{font-size:22px;letter-spacing:.2em}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:10px}
  .nav button{flex:1;padding:14px 0;border-radius:12px;font-size:16px;background:#fffaf0;border:1px solid #d8c7ab}
  .nav button:disabled{opacity:.35}
  .nav .count{flex:0 0 auto;font-size:14px;color:var(--soft);min-width:64px;text-align:center}
  .progress{height:3px;background:#e8dcc6;border-radius:3px;overflow:hidden}
  .progress i{display:block;height:100%;background:var(--red);width:0;transition:width .4s}
</style>
</head>
<body>
<div class="app">

  <!-- 表紙 -->
  <section id="cover">
    <div class="butai"><div class="stage"><img src="images/img01.webp" alt="表紙"></div></div>
    <div>
      <p class="label">ゆわ魔法図書館の紙芝居</p>
      <h1 class="title">レディーファースト</h1>
      <p class="author">桜庭ゆわ</p>
    </div>
    <div class="btns">
      <button class="btn btn-main" id="startVoice">🔊 朗読を聞きながら読む</button>
      <button class="btn btn-sub" id="startSilent">📖 文字だけで読む</button>
    </div>
    <p class="note" id="voiceNote">朗読の声が流れます。音量に気をつけてね。<br>読み終わると、自動でページがめくれます。</p>
  </section>

  <!-- 読む画面 -->
  <section id="reader">
    <div class="topbar">
      <span class="t">レディーファースト</span>
      <button class="pill" id="soundBtn">🔇 声なし</button>
    </div>
    <div class="progress"><i id="bar"></i></div>
    <div class="butai"><div class="stage" id="stage"><img id="pic" alt=""></div></div>
    <div class="textbox" id="text"></div>
    <div class="nav">
      <button id="prev">◀ まえ</button>
      <span class="count" id="count"></span>
      <button id="next">つぎ ▶</button>
    </div>
  </section>

</div>

<script>
const PAGES = [{"img": "img01.webp", "text": "68歳のあきこには、最近ちょっとした悩みがあった。誰も、自分を女性として扱ってくれないのだ。", "audio": "page01.mp3"}, {"img": "img02.webp", "text": "夫からは「おい」。息子からは「母さん」。娘からは「お母さん」。孫からは「ばあば」。まあ、間違ってはいない。……いや。夫の「おい」は、ちょっと違う気がする。「私、あきこって名前があるんだけどねぇ」", "audio": "page02.mp3"}, {"img": "img03.webp", "text": "ある日の午後。あきこは買い物帰りに、小さな喫茶店へ立ち寄った。入口に手を伸ばした、そのとき。若い男性が、さっとドアを開けてくれた。「どうぞ」「あら、大丈夫よ。あなた、先にどうぞ」すると男性は、にっこり笑った。「いえいえ。レディーファーストですから」", "audio": "page03.mp3"}, {"img": "img03.webp", "text": "あきこは思わず後ろを振り返った。誰もいない。右を見た。誰もいない。もう一度、男性を見た。「……私？」「はい！」「私、68歳よ？」男性はきょとんとした。「え？ レディーに定年ってあるんですか？」", "audio": "page04.mp3"}, {"img": "img04.webp", "text": "あきこは、吹き出した。「あっはっは！ そりゃそうだ！」店に入ると、いつものコーヒーを注文しようとして、ふと手を止めた。ショーケースには、真っ赤ないちごが乗ったケーキ。「……これも、いただこうかしら」今日は、なんだか特別な日だ。", "audio": "page05.mp3"}, {"img": "img05.webp", "text": "帰り道。あきこは化粧品店の前で足を止めた。「そういえば、口紅なんて何年も買ってないわね」翌日。あきこは、新しい口紅をつけて出かけた。ちょっと派手な、ローズピンク。鏡の前で何度も確認した。「……まあ、いいじゃない！」そして、いつもの喫茶店へ。", "audio": "page06.mp3"}, {"img": "img06.webp", "text": "入口には、杖をついた年配の女性がいた。あきこは、さっとドアを開けた。「どうぞ。レディーファーストですから！」女性は驚いた顔をした。「あら、ありがとう。でも、あなたもレディでしょう？」あきこは、にっこり笑った。「もちろん！ さあ、レディの先輩、お先にどうぞ！」", "audio": "page07.mp3"}, {"img": "img07.webp", "text": "すると女性は、ふふっと笑った。「あら、そう？ じゃあ、お言葉に甘えようかしら」二人は顔を見合わせて笑った。その日、喫茶店には、二人の楽しそうな笑い声が響いていた。", "audio": "page08.mp3"}, {"img": "img07.webp", "text": "あきこは思った。昨日、あの青年が開けてくれたのは、喫茶店のドアだけじゃなかったのかもしれない。忘れかけていた、自分自身への小さな扉。誰かの妻でも、誰かの母でも、誰かのおばあちゃんでも。何歳になっても。私は、私。そして、レディーに定年なんてないのだ。", "audio": "page09.mp3"}, {"img": "img07.webp", "end": true}];
const OPCHAT = "https://line.me/ti/g2/JLE5DC_IjliePPb9tKLrPhVyAReacddikiOvPw?utm_source=invitation&utm_medium=link_copy&utm_campaign=default";

const $ = id => document.getElementById(id);
const player = new Audio();
player.preload = "auto";
let page = 0, voiceOn = false, autoTimer = null, spans = [], bounds = [];

/* ---------- 文を区切る（字幕のハイライト用） ---------- */
function splitSentences(t){
  const out=[]; let buf="";
  const close="」〉』）";
  for(let i=0;i<t.length;i++){
    const c=t[i]; buf+=c;
    if("。！？".includes(c)){
      while(i+1<t.length && close.includes(t[i+1])){ buf+=t[++i]; }
      out.push(buf); buf="";
    }else if((c==="〉"||c==="」") && "〈「".includes(t[i+1]||"")){
      out.push(buf); buf="";
    }
  }
  if(buf.trim()) out.push(buf);
  return out;
}

/* ---------- ページ表示 ---------- */
function render(dir){
  const p = PAGES[page];
  const img = $("pic");
  const newSrc = "images/"+p.img;
  if(dir && !img.src.endsWith(p.img)){
    const old = img.cloneNode(); old.removeAttribute("id");
    $("stage").appendChild(old);
    old.className = dir>0 ? "slide-out" : "slide-out-r";
    img.src = newSrc;
    img.className = dir>0 ? "slide-in" : "slide-in-r";
    setTimeout(()=>{ old.remove(); img.className=""; },460);
  }else{
    img.src = newSrc;
  }
  img.alt = (page+1)+"ページ目の絵";

  const box = $("text");
  box.scrollTop = 0;
  if(p.end){
    box.className="textbox end";
    box.innerHTML = '<p class="owari">―― おしまい ――</p><p>桜庭ゆわ</p>'+
      '<a class="btn btn-main" style="margin-top:8px;text-decoration:none;display:block;text-align:center" href="'+OPCHAT+'">📚 ゆわの魔法図書館に戻る</a>'+
      '<button class="btn btn-sub" id="again">はじめから読む</button>'+
      '<a class="btn btn-sub" style="text-decoration:none;display:block;text-align:center" href="index.html">ほかの形式で楽しむ</a>';
    $("again").onclick = ()=>{ go(0-page); };
    spans=[]; bounds=[];
  }else{
    box.className="textbox";
    const ss = splitSentences(p.text);
    box.innerHTML = ss.map((s,i)=>'<span class="s" data-i="'+i+'">'+s+'</span>').join("");
    spans = [...box.querySelectorAll(".s")];
    // 文字数の割合で、声のどのあたりがどの文かを決める
    const total = ss.reduce((a,s)=>a+s.length,0); let acc=0;
    bounds = ss.map(s=>{ acc+=s.length; return acc/total; });
  }
  $("count").textContent = (page+1)+" / "+PAGES.length;
  $("bar").style.width = ((page+1)/PAGES.length*100)+"%";
  $("prev").disabled = page===0;
  $("next").disabled = page===PAGES.length-1;

  if(PAGES[page+1]){ const pre=new Image(); pre.src="images/"+PAGES[page+1].img; }

  if(voiceOn) playPage(); else stopVoice();
}
function go(d){
  const n = page+d;
  if(n<0 || n>=PAGES.length) return;
  clearTimeout(autoTimer);
  page = n;
  render(d>0?1:-1);
}

/* ---------- ナレーション（マルの音声） ---------- */
let lastIdx = -1;
function playPage(){
  clearTimeout(autoTimer);
  lastIdx = -1;
  const p = PAGES[page];
  if(!p.audio){ player.pause(); return; }
  player.src = "audio/"+p.audio;
  player.currentTime = 0;
  const pr = player.play();
  if(pr && pr.catch) pr.catch(()=>{ setVoice(false); });
}
function stopVoice(){
  clearTimeout(autoTimer);
  player.pause();
  spans.forEach(s=>s.classList.remove("now"));
}
player.addEventListener("timeupdate",()=>{
  if(!voiceOn || !player.duration || !spans.length) return;
  const r = player.currentTime / player.duration;
  let idx = bounds.findIndex(b=>r < b);
  if(idx<0) idx = spans.length-1;
  if(idx!==lastIdx){
    spans.forEach(s=>s.classList.remove("now"));
    spans[idx].classList.add("now");
    spans[idx].scrollIntoView({block:"nearest",behavior:"smooth"});
    lastIdx = idx;
  }
});
player.addEventListener("ended",()=>{
  spans.forEach(s=>s.classList.remove("now"));
  if(voiceOn && page<PAGES.length-1) autoTimer=setTimeout(()=>go(1),1200);
});
function setVoice(on){
  voiceOn = on;
  $("soundBtn").textContent = on ? "🔊 声あり" : "🔇 声なし";
  $("soundBtn").classList.toggle("on",on);
  if(on) playPage(); else stopVoice();
}

/* ---------- 操作 ---------- */
function start(withVoice){
  $("cover").style.display="none";
  $("reader").style.display="flex";
  page = 0;
  voiceOn = withVoice;
  $("soundBtn").textContent = withVoice ? "🔊 声あり" : "🔇 声なし";
  $("soundBtn").classList.toggle("on",withVoice);
  render(0);
}
$("startVoice").onclick = ()=> start(true);   // タップの中で再生が始まるので、iPhoneでも声が出る
$("startSilent").onclick = ()=> start(false);
$("soundBtn").onclick = ()=> setVoice(!voiceOn);
$("prev").onclick = ()=> go(-1);
$("next").onclick = ()=> go(1);
$("stage").onclick = ()=> go(1);
document.addEventListener("keydown",e=>{
  if($("reader").style.display!=="flex") return;
  if(e.key==="ArrowRight") go(1);
  if(e.key==="ArrowLeft") go(-1);
});
let sx=null, sy=null;
$("reader").addEventListener("touchstart",e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
$("reader").addEventListener("touchend",e=>{
  if(sx===null) return;
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5) go(dx<0?1:-1);
  sx=null;
},{passive:true});
</script>
</body>
</html>
