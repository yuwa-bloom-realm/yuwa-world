<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数字からのメッセージ | Yuwa Entertainment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-deep:   #0b1230;
    --ink-mid:    #16234f;
    --ink-soft:   #223167;
    --gold:       #d8b878;
    --gold-soft:  #efd9a6;
    --cream:      #faf5e9;
    --cream-dim:  #ede4d0;
    --text-dark:  #2c2416;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse 90% 60% at 50% -10%, rgba(216,184,120,0.14), transparent 60%),
      radial-gradient(ellipse 120% 80% at 20% 110%, rgba(216,184,120,0.08), transparent 55%),
      linear-gradient(180deg, var(--ink-deep) 0%, var(--ink-mid) 55%, var(--ink-soft) 100%);
    font-family: "Noto Serif JP", serif;
    color: var(--cream);
    position: relative;
    overflow-x: hidden;
    padding: 0 0 48px;
  }

  .wrap{
    position:relative; z-index:1;
    width: 100%;
    max-width: 100%;
    margin: 0 auto;
    padding: 0 22px 0;
  }
  .wrap.has-hero{ padding-top: 0; }
  .wrap:not(.has-hero){ padding-top: 44px; }

  /* --- hero artwork (the full illustration IS the entry screen) --- */
  .hero-stage{
    margin: 0 -22px 0;
    position: relative;
    width: 100%;
    padding-top: 177.68%; /* locks in the artwork's aspect ratio (941x1672) so
                              overlay children's %-based positions are always
                              resolvable, even before the image finishes loading */
    overflow: hidden;
  }
  .hero-stage img{
    position: absolute; top:0; left:0; right:0; bottom:0;
    width: 100%; height: 100%;
    display:block;
  }
  .hero-fade{
    position:absolute; left:0; right:0; bottom:-1px; height:40px;
    background: linear-gradient(180deg, rgba(11,18,48,0) 0%, var(--ink-deep) 100%);
  }

  /* overlay controls positioned by % so they track the artwork at any width.
     Percentages measured directly against the artwork's native pixel grid
     (941x1672), so they hold regardless of the rendered screen size. */
  .hero-input{
    position:absolute;
    left:25.5%; width:59.5%;
    top:63.9%; height:3.85%;
    border:none; outline:none;
    background: #faf6ef;
    text-align:center;
    font-family:"Noto Serif JP", serif;
    color:#4a3f2d;
    letter-spacing:.03em;
    -webkit-appearance:none; appearance:none;
    padding:0; margin:0;
    line-height:normal;
    font-size: 3.2vw;
  }
  .hero-input::placeholder{ color:#7a6c52; font-family:"Noto Serif JP", serif; }
  .hero-input:focus{ background:#fffdf8; box-shadow: inset 0 0 0 1px rgba(200,168,105,.5); }

  .hero-btn{
    position:absolute;
    left:19.3%; width:59%;
    top:69.4%; height:5.3%;
    background: transparent;
    border:none;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
    border-radius: 999px;
    transition: background-color .15s ease;
  }
  .hero-btn:hover, .hero-btn:focus-visible{ background: rgba(255,255,255,.08); }
  .hero-btn:active{ background: rgba(255,255,255,.18); }

  .hero-error{ display:none; } /* no longer used as an overlay bubble —
    kept as a no-op so old JS references don't error; see .hero-input.shake */

  .hero-input.shake{
    animation: heroShake .38s ease;
    box-shadow: inset 0 0 0 2px rgba(200,60,60,.75) !important;
  }
  @keyframes heroShake{
    0%,100%{ transform: translateX(0); }
    20%{ transform: translateX(-4px); }
    40%{ transform: translateX(4px); }
    60%{ transform: translateX(-3px); }
    80%{ transform: translateX(3px); }
  }

  /* --- header --- */
  header{ text-align:center; margin-bottom: 30px; }
  header.top-header{ padding-top:44px; }
  .brand{
    font-family:"Cormorant Garamond", serif;
    letter-spacing: .32em;
    font-size: 13px;
    color: var(--gold-soft);
    text-transform: uppercase;
  }
  .div-line{
    width:120px; height:1px; margin:10px auto 22px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    position:relative;
  }
  .div-line::after{
    content:"✦"; position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%);
    color:var(--gold); background:var(--ink-mid); padding:0 8px; font-size:11px;
  }
  h1{
    font-size: 32px;
    line-height: 1.4;
    margin: 0 0 6px;
    font-weight: 700;
    color: var(--cream);
    letter-spacing:.02em;
  }
  .sub-en{
    font-family:"Cormorant Garamond", serif;
    font-style: italic;
    color: var(--gold-soft);
    font-size: 15px;
    letter-spacing:.06em;
  }
  .lead{
    margin-top: 26px;
    font-size: 14.5px;
    line-height: 2;
    color: var(--cream-dim);
  }
  .lead .ask{
    display:block; margin-top:16px;
    font-size: 15.5px;
    color: var(--gold-soft);
  }

  /* --- input card (legacy, no longer used by inputView but kept
       in case a non-image fallback layout is needed) --- */

  button.cta{
    width:100%;
    margin-top: 20px;
    padding: 15px 18px;
    border:none;
    border-radius: 999px;
    cursor:pointer;
    font-family:"Noto Serif JP", serif;
    font-size: 16px;
    letter-spacing:.08em;
    color: var(--gold-soft);
    background: linear-gradient(135deg, var(--ink-mid), var(--ink-deep));
    box-shadow: 0 0 0 1px rgba(216,184,120,.6), 0 10px 24px rgba(0,0,0,.35);
    display:flex; align-items:center; justify-content:center; gap:10px;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  button.cta:hover{ transform: translateY(-1px); box-shadow:0 0 0 1px var(--gold), 0 14px 28px rgba(0,0,0,.4); }
  button.cta:active{ transform: translateY(0); }
  button.ghost{
    background: transparent;
    color: var(--gold-soft);
    border: 1px solid rgba(216,184,120,.6);
    box-shadow:none;
  }

  /* --- feature row --- */
  .features{
    display:grid; grid-template-columns: repeat(3,1fr);
    gap: 14px; margin-top: 34px; text-align:center;
  }
  .features .ico{
    width:44px; height:44px; margin:0 auto 10px;
    border-radius:50%;
    border:1px solid rgba(216,184,120,.6);
    display:flex; align-items:center; justify-content:center;
    color: var(--gold-soft); font-size:17px;
  }
  .features h3{ font-size:12.5px; margin:0 0 6px; color:var(--cream); font-weight:600; }
  .features p{ font-size:10.8px; line-height:1.6; color: var(--cream-dim); margin:0; }

  footer{
    text-align:center; margin-top: 44px;
    color: var(--gold-soft); font-size:12px; letter-spacing:.04em;
  }
  footer .tag{ font-size:10.5px; color: var(--cream-dim); margin-top:4px; }

  /* --- result screen --- */
  #resultView{ display:none; }
  .result-card{
    background: var(--cream);
    border-radius: 18px;
    padding: 32px 24px 28px;
    margin-top: 30px;
    box-shadow: 0 18px 40px rgba(0,0,0,.35), 0 0 0 1px rgba(216,184,120,.5);
    color: var(--text-dark);
    position:relative;
  }
  .result-number{
    text-align:center;
    font-family:"Cormorant Garamond", serif;
    font-size: 46px;
    letter-spacing:.08em;
    color: var(--ink-mid);
    margin-bottom: 2px;
  }
  .result-title{
    text-align:center;
    font-size: 17px;
    font-weight:700;
    color: var(--ink-mid);
    margin-bottom: 18px;
  }
  .result-body{
    font-size: 14.5px;
    line-height: 2.05;
    color: #3a3222;
    white-space: pre-line;
  }
  .breakdown{
    margin-top:14px;
    font-family:"Cormorant Garamond", serif;
    font-size: 13px;
    color:#9a8b62;
    text-align:center;
    letter-spacing:.04em;
  }
  .final-box{
    margin-top: 20px;
    padding: 14px 16px;
    background: #f3ecda;
    border-radius: 12px;
    border-left: 3px solid var(--gold);
  }
  .final-box .ft-label{ font-size:11.5px; color:#8a7c5c; margin-bottom:4px; }
  .final-box .ft-theme{ font-size:14.5px; font-weight:700; color:var(--ink-mid); }

  .question-block{
    margin-top: 24px;
    text-align:center;
  }
  .question-block .q-divider{
    font-family:"Cormorant Garamond", serif;
    font-style: italic;
    font-size: 12.5px;
    color:#9a8b62;
    margin-bottom: 10px;
  }
  .question-block .q-text{
    font-size: 15.5px;
    font-weight: 600;
    color: var(--ink-mid);
    line-height:1.8;
  }

  .disclaimer{
    margin-top: 26px;
    font-size: 10.8px;
    line-height: 1.8;
    color: #9c9078;
    border-top: 1px solid #e6dcc4;
    padding-top: 14px;
  }

  @media (max-width:380px){
    h1{ font-size:27px; }
    .result-number{ font-size:38px; }
  }
</style>
</head>

/* ===================================================================
   表現バリエーション（テンプレ感を減らすためのパターン集）
=================================================================== */
const V = {
  dominant: [
    (d,c,t)=>`${d}が${c}回登場していることから、「${t}」というテーマが強く重なっているようです。`,
    (d,c,t)=>`${d}が${c}回も顔を出しているのは、「${t}」を意識してほしいというサインなのかもしれません。`,
    (d,c,t)=>`${c}回続く${d}が、「${t}」というテーマを際立たせています。`,
    (d,c,t)=>`${d}の登場回数が多いのは、「${t}」というテーマが今のあなたに強く響いているからかもしれません。`
  ],
  noDominant: [
    ()=>`同じ数字の重なりはありませんが、並んだ数字たちがそれぞれのテーマで静かに呼応しています。`,
    ()=>`重複はないものの、ひとつずつの数字が違う角度からメッセージを届けているようです。`,
    ()=>`ゾロ目ではありませんが、その分いろいろなテーマが一度に集まっている数字とも言えそうです。`
  ],
  flow: [
    (seq)=>`${seq}というように、ひとつずつ流れをたどることができます。`,
    (seq)=>`並びを追っていくと、${seq}という物語が見えてきます。`,
    (seq)=>`数字の順番のとおり、${seq}という流れが、今のあなたに重なっているのかもしれません。`,
    (seq)=>`${seq}。この並びの中に、ゆるやかな展開が隠れているようです。`
  ],
  landing: [
    (t,desc)=>`最後にたどり着くのは「${t}」というテーマ。${desc}`,
    (t,desc)=>`行き着く先にあるのは「${t}」。${desc}`,
    (t,desc)=>`すべてをひとつにまとめると、「${t}」というテーマにつながっていきます。${desc}`,
    (t,desc)=>`着地点は「${t}」。${desc}`
  ]
};

function hashPick(str, arr, salt){
  let h = 0;
  const s = str + "|" + salt;
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; }
  return arr[h % arr.length];
}

/* ===================================================================
   数秘計算
=================================================================== */
function digitalRoot(digits){
  let n = digits.reduce((a,b)=>a+b,0);
  const steps = [n];
  while(n >= 10){
    n = String(n).split('').reduce((a,b)=>a+Number(b),0);
    steps.push(n);
  }
  return {final:n, steps};
}

function buildMessage(raw){
  const digits = raw.split('').map(Number);

  /* ---- 1桁のみ ---- */
  if(digits.length === 1){
    const d = digits[0];
    const info = DIGIT_THEMES[d];
    return {
      title: `${raw}からのメッセージ`,
      body: `${d}が示すのは「${info.theme}」というテーマ。\n${info.desc}`,
      breakdown: "",
      showFinal: false,
      finalTheme: "",
      question: info.question
    };
  }

  /* ---- 頻度カウント ---- */
  const freq = {};
  digits.forEach(d=>{ freq[d] = (freq[d]||0)+1; });
  const dominantDigits = Object.keys(freq).filter(k=>freq[k]>1).sort((a,b)=>freq[b]-freq[a]);

  let dominantText;
  if(dominantDigits.length > 0){
    dominantText = dominantDigits.map(dStr=>{
      const d = Number(dStr);
      const info = DIGIT_THEMES[d];
      const fn = hashPick(raw, V.dominant, "dom-"+dStr);
      return fn(d, freq[dStr], info.theme);
    }).join('　');
  } else {
    dominantText = hashPick(raw, V.noDominant, "nodom")();
  }

  /* ---- 流れの説明 ---- */
  const seq = digits.map(d=>`${d}の「${DIGIT_THEMES[d].theme.split('・')[0]}」`).join(' → ');
  const flowFn = hashPick(raw, V.flow, "flow");
  const flowText = flowFn(seq);

  /* ---- 最終数字 ---- */
  const {final, steps} = digitalRoot(digits);
  const finalInfo = DIGIT_THEMES[final];
  const landingFn = hashPick(raw, V.landing, "land");
  const landingText = landingFn(finalInfo.theme, finalInfo.desc);

  const body =
`${dominantText}
${flowText}

そして、この数字をひとつにたどると「${final}」。
${landingText}`;

  const breakdown = steps.length > 1
    ? `${digits.join('+')} = ${steps[0]}${steps.length>2 ? ' → '+steps.slice(1).join(' → ') : ' → '+steps[1]}`
    : `${digits.join('+')} = ${steps[0]}`;

  return {
    title: `${raw}からのメッセージ`,
    body,
    breakdown,
    showFinal: true,
    finalTheme: `「${final}」　${finalInfo.theme}`,
    question: finalInfo.question
  };
}

function getResult(raw){
  if(SPECIAL_NUMBERS[raw]){
    const s = SPECIAL_NUMBERS[raw];
    return {
      title: `${raw}からのメッセージ`,
      body: `${s.theme}\n\n${s.message}`,
      breakdown: "",
      showFinal: false,
      finalTheme: "",
      question: s.question
    };
  }
  return buildMessage(raw);
}

/* ===================================================================
   UI 制御
=================================================================== */
const inputView  = document.getElementById('inputView');
const resultView = document.getElementById('resultView');
const numInput   = document.getElementById('numInput');
const errorMsg   = document.getElementById('errorMsg');
const MAX_DIGITS = 12;

function showResult(raw){
  const r = getResult(raw);
  document.getElementById('rNumber').textContent = raw;
  document.getElementById('rTitle').textContent  = r.title;
  document.getElementById('rBody').textContent   = r.body;
  document.getElementById('rBreakdown').textContent = r.breakdown;

  const finalBox = document.getElementById('rFinalBox');
  if(r.showFinal){
    finalBox.style.display = 'block';
    document.getElementById('rFinalTheme').textContent = r.finalTheme;
  } else {
    finalBox.style.display = 'none';
  }
  document.getElementById('rQuestion').textContent = r.question;

  inputView.style.display  = 'none';
  resultView.style.display = 'block';
  window.scrollTo({top:0, behavior:'smooth'});
}

function showError(){
  numInput.classList.remove('shake');
  // restart animation even if triggered twice in a row
  void numInput.offsetWidth;
  numInput.classList.add('shake');
  numInput.focus();
}
function hideError(){
  numInput.classList.remove('shake');
}

document.getElementById('submitBtn').addEventListener('click', ()=>{
  const cleaned = numInput.value.replace(/[^0-9]/g,'');
  if(cleaned.length === 0){
    showError();
    return;
  }
  if(cleaned.length > MAX_DIGITS){
    showError();
    return;
  }
  hideError();
  showResult(cleaned);
});

numInput.addEventListener('input', hideError);
numInput.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){ document.getElementById('submitBtn').click(); }
});

document.getElementById('againBtn').addEventListener('click', ()=>{
  resultView.style.display = 'none';
  inputView.style.display  = 'block';
  numInput.value = '';
  hideError();
  window.scrollTo({top:0, behavior:'smooth'});
});
