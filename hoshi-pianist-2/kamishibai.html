<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>星が降る夜のピアニストⅡ｜紙芝居</title>
<meta name="description" content="桜庭ゆわの短編物語を、絵をめくりながら、文字で読む紙芝居で。">
<meta property="og:title" content="星が降る夜のピアニストⅡ｜紙芝居">
<meta property="og:description" content="桜庭ゆわの短編物語を、絵をめくりながら、文字で読む紙芝居で。">
<meta property="og:image" content="images/img01.webp">
<style>
  :root{
    --paper:#f6efe2;
    --paper2:#efe4cf;
    --ink:#3b2f25;
    --soft:#7a6a58;
    --wood:#8a5a36;
    --wood2:#6e4426;
    --red:#c2557a;
    --hl:#fff3c4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(ellipse at top,#fbf6ec 0%,var(--paper) 55%,var(--paper2) 100%);
    color:var(--ink);
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
    -webkit-tap-highlight-color:transparent;
    overflow:hidden;
  }
  .app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:720px;margin:0 auto;
       padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

  /* ---------- 紙芝居の木枠 ---------- */
  .butai{
    position:relative;border-radius:10px;padding:10px;
    background:linear-gradient(135deg,var(--wood) 0%,var(--wood2) 100%);
    box-shadow:0 6px 18px rgba(60,35,15,.28), inset 0 0 0 2px rgba(255,255,255,.08);
  }
  .butai::before{content:"";position:absolute;inset:4px;border-radius:7px;border:1px solid rgba(255,230,190,.25);pointer-events:none}
  .stage{position:relative;overflow:hidden;border-radius:4px;background:#fdf9f1;aspect-ratio:16/9;max-height:42vh;margin:0 auto}
  .stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fdf9f1}
  .stage img.slide-out{animation:out .45s ease forwards}
  .stage img.slide-in{animation:in .45s ease forwards}
  .stage img.slide-out-r{animation:outr .45s ease forwards}
  .stage img.slide-in-r{animation:inr .45s ease forwards}
  @keyframes out{to{transform:translateX(-105%)}}
  @keyframes in{from{transform:translateX(105%)}to{transform:none}}
  @keyframes outr{to{transform:translateX(105%)}}
  @keyframes inr{from{transform:translateX(-105%)}to{transform:none}}

  /* ---------- 表紙 ---------- */
  #cover{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:18px 4px}
  .label{text-align:center;font-size:12px;letter-spacing:.3em;color:var(--soft)}
  .title{text-align:center;font-size:clamp(22px,6vw,30px);line-height:1.5;letter-spacing:.06em}
  .author{text-align:center;font-size:15px;color:var(--soft);letter-spacing:.2em}
  .btns{display:flex;flex-direction:column;gap:12px;align-items:center}
  .btn{width:min(320px,100%);padding:15px 18px;border-radius:999px;font-size:16px;letter-spacing:.08em;
       transition:transform .1s}
  .btn:active{transform:scale(.97)}
  .btn-main{background:var(--red);color:#fff;box-shadow:0 4px 12px rgba(194,85,122,.3)}
  .btn-sub{background:#fffaf0;border:1px solid #d8c7ab}
  .note{text-align:center;font-size:12px;color:var(--soft);line-height:1.7}

  /* ---------- 読む画面 ---------- */
  #reader{flex:1;display:none;flex-direction:column;min-height:0;gap:10px;padding-top:8px}
  .topbar{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--soft);min-height:38px}
  .topbar .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
  .pill{padding:7px 12px;border-radius:999px;background:#fffaf0;border:1px solid #d8c7ab;font-size:13px;white-space:nowrap}
  .pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .textbox{flex:1;min-height:0;overflow-y:auto;background:rgba(255,252,245,.85);border:1px solid #e3d5bd;border-radius:10px;
           padding:16px 18px;font-size:17px;line-height:2;letter-spacing:.03em;-webkit-overflow-scrolling:touch}
  .textbox .s{display:block;transition:background .3s;border-radius:4px;padding:1px 0}
  .textbox .s.ch{text-align:center;color:var(--red);letter-spacing:.15em;font-size:15px;margin:4px 0 10px}
  .textbox .s.now{background:var(--hl);box-shadow:0 0 0 2px var(--hl)}
  .textbox.end{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px}
  .owari{font-size:22px;letter-spacing:.2em}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:10px}
  .nav button{flex:1;padding:14px 0;border-radius:12px;font-size:16px;background:#fffaf0;border:1px solid #d8c7ab}
  .nav button:disabled{opacity:.35}
  .nav .count{flex:0 0 auto;font-size:14px;color:var(--soft);min-width:64px;text-align:center}
  .progress{height:3px;background:#e8dcc6;border-radius:3px;overflow:hidden}
  .progress i{display:block;height:100%;background:var(--red);width:0;transition:width .4s}
</style>
</head>
<body>
<div class="app">

  <!-- 表紙 -->
  <section id="cover">
    <div class="butai"><div class="stage"><img src="images/img01.webp" alt="表紙"></div></div>
    <div>
      <p class="label">ゆわ魔法図書館の紙芝居</p>
      <h1 class="title">星が降る夜のピアニストⅡ<br><span style="font-size:.6em">〜時を越えた旋律〜</span></h1>
      <p class="author">桜庭ゆわ</p>
    </div>
    <div class="btns">
      <button class="btn btn-main" id="start">🎴 紙芝居をめくる</button>
    </div>
    <p class="note">絵をタップするか、左右にスワイプするとめくれます。<br>音は出ません。自分のペースで、ゆっくりどうぞ。</p>
  </section>

  <!-- 読む画面 -->
  <section id="reader">
    <div class="topbar">
      <span class="t">星が降る夜のピアニストⅡ</span>
      <a class="pill" href="index.html" style="text-decoration:none;color:inherit">ほかの形式</a>
    </div>
    <div class="progress"><i id="bar"></i></div>
    <div class="butai"><div class="stage" id="stage"><img id="pic" alt=""></div></div>
    <div class="textbox" id="text"></div>
    <div class="nav">
      <button id="prev">◀ まえ</button>
      <span class="count" id="count"></span>
      <button id="next">つぎ ▶</button>
    </div>
  </section>

</div>

<script>
// 紙芝居は音声なし（絵と文章だけ）が標準
const PAGES = [{"img": "img01.webp", "alt": "表紙", "lines": ["#第一幕　止まった時計", "あの夜。", "少年は、まばゆい光の中に消えた。", "遠くで聞こえるピアノの音。", "誰かが、自分を呼んでいるような気がした。", "けれど、その声も次第に遠ざかり——", "やがて、何も聞こえなくなった。"]}, {"img": "img02.webp", "alt": "石畳で目を覚ます少年", "lines": ["どれくらい眠っていたのだろう。", "少年がゆっくりと目を開けると、そこには見覚えのある街が広がっていた。"]}, {"img": "img03.webp", "alt": "起き上がり見回す少年", "lines": ["石畳の道。", "古い時計台。", "角にある小さな花屋。", "いつもと変わらない景色。"]}, {"img": "img04.webp", "alt": "誰もいない街に立つ少年", "lines": ["けれど、何かがおかしい。", "「……あれ？」", "誰もいない。", "花屋にも、パン屋にも、広場にも。", "「おーい！」", "少年は大きな声で叫んだ。", "「誰かいませんかー！」", "返事はない。", "「ねえ！　どこにいるのー？」"]}, {"img": "img06.webp", "alt": "少女を探して歩く少年", "lines": ["少女を探して走り出した。", "いつも一緒に歩いた道。", "笑いながら駆け抜けた広場。", "けれど、どこにも少女の姿はなかった。", "「……どこ行っちゃったんだよ」"]}, {"img": "img05.webp", "alt": "止まった時計台", "lines": ["ふと、時計台を見上げた。", "時計の針は、あの夜の時刻を指したまま止まっていた。", "風が吹いた。", "花屋の前に置かれたリボンが、ひらひらと揺れている。", "なのに、時計だけは動かない。", "「……ここ、どこなんだろう」", "少年は、もう一度少女の名前を呼んだ。", "けれど、返事はなかった。"]}, {"img": "img07.webp", "alt": "ベンチで膝を抱える少年", "lines": ["#第二幕　誰もいない街のピアノ", "どれほど歩いただろう。", "少年は広場のベンチに腰を下ろした。", "「……おかしいなぁ」", "街は、あの夜のままだった。", "夕焼けの空も、建物の影も、何ひとつ変わらない。", "朝にもならない。", "夜にもならない。", "少年は膝を抱えた。", "「……ひとりじゃ、つまんないよ」"]}, {"img": "img08.webp", "alt": "音に気づく少年", "lines": ["そのときだった。", "ポーン……。", "どこからか、小さな音が聞こえた。", "少年は顔を上げた。", "「……ピアノ？」", "耳を澄ます。", "ポロン……。", "もう一度、音がした。", "少年は立ち上がり、音のする方へ走り出した。"]}, {"img": "img09.webp", "alt": "路地の先の建物", "lines": ["細い路地を抜け、古い階段を上る。", "そこには、小さな建物があった。"]}, {"img": "img10.webp", "alt": "古いピアノのある部屋", "lines": ["扉を開けると、一台の古いピアノが置かれていた。", "けれど、誰もいない。", "「……あれ？　誰が弾いてたんだろう」", "少年はそっと鍵盤に触れた。", "ポーン。", "懐かしい音が響いた。"]}, {"img": "img11.webp", "alt": "弾き間違えて悔しがる少年", "lines": ["少年は椅子に座った。", "そして、あの曲を弾き始めた。", "ポロン、ポロン……。", "「あっ、間違えた」", "最初からやり直す。", "ポロン、ポロン……。", "「あれ？」", "もう一度。", "「あー！　また間違えた！」", "少年は鍵盤に突っ伏した。", "「なんで、うまく弾けないかなぁ……」"]}, {"img": "img12.webp", "alt": "二人で弾いた思い出", "lines": ["ふと、少女の笑顔が浮かんだ。", "間違えるたびに笑っていた少女。", "「もう一回！」", "そう言って、何度でも付き合ってくれた。", "少年は小さく笑った。", "「……また、笑われちゃうな」", "けれど、今はその笑い声も聞こえない。", "少年は、もう一度鍵盤に指を置いた。"]}, {"img": "img13.webp", "alt": "窓を見上げる少年", "lines": ["#第三幕　最後の一音", "何度も。", "何度も。", "少年はピアノを弾いた。", "間違えては、最初から。", "途中まで弾けても、また間違える。", "「……もう！」", "少年は大きく息を吐いた。", "そして、誰もいない部屋でつぶやいた。", "「……ねえ、聞いてる？」", "返事はない。", "「今度こそ、ちゃんと弾くからさ」", "少年は鍵盤を見つめた。", "「……だから、もう一回会おうよ」"]}, {"img": "img14.webp", "alt": "真剣にピアノを弾く少年", "lines": ["静かな部屋に、ピアノの音が響き始めた。", "一音。", "また一音。", "今度は間違えない。", "あの子と笑いながら弾いた曲。", "あの子が大好きだった曲。", "少年の指が、最後の鍵盤に触れた。", "ポーン……。", "美しい余韻が、部屋いっぱいに広がった。", "「……弾けた！」", "少年は思わず立ち上がった。"]}, {"img": "img15.webp", "alt": "動き出す時計の針", "lines": ["その瞬間。", "カチッ。", "どこかで、小さな音がした。", "カチッ、カチッ、カチッ……。", "少年が窓の外を見ると——", "止まっていた時計台の針が、動き始めていた。", "「……え？」"]}, {"img": "img16.webp", "alt": "光と風に包まれる少年", "lines": ["突然、風が吹き込んだ。", "カーテンが大きく舞い上がる。", "窓の外の景色が、ゆっくりと光に溶けていく。", "石畳も。", "時計台も。", "夕焼けの空も。", "「うわっ！」", "少年は思わず目を閉じた。"]}, {"img": "img17.webp", "alt": "音楽堂", "lines": ["やがて、風がやんだ。", "恐る恐る目を開ける。", "そこは、夜だった。", "空には、無数の星が瞬いていた。", "そして、目の前には——", "見覚えのある音楽堂が建っていた。", "「……あっ！」", "少年は駆け出した。"]}, {"img": "img18.webp", "alt": "音楽堂の前の少年", "lines": ["#第四幕　懐かしい鼻歌", "音楽堂の窓から、柔らかな光が漏れていた。", "中からは、ピアノの音が聞こえてくる。", "少年は足を止めた。", "「……この曲」", "知っている。", "何度も聴いた。", "何度も一緒に弾いた。"]}, {"img": "img19.webp", "alt": "鼻歌を歌う少年", "lines": ["少年は、思わず鼻歌を歌い始めた。", "ふん、ふふん……。"]}, {"img": "img20.webp", "alt": "ピアノを弾く女性", "lines": ["その頃。", "音楽堂の中では、ひとりの女性がピアノを弾いていた。", "あの夜から、十数年。", "少女は、大人になっていた。", "季節がいくつも過ぎた。", "街の景色も、少しずつ変わった。", "けれど、彼女は今も、あの曲を弾いていた。", "あの夜のことを、忘れたことはなかった。", "少年の笑い声。", "何度も間違えたピアノ。", "そして、光の中に消えてしまった、小さな背中。", "もう一度会えたら。", "何度、そう願っただろう。", "けれど、叶うはずのない願いだと思っていた。"]}, {"img": "img21.webp", "alt": "鼻歌に気づく女性", "lines": ["そのときだった。", "ふん、ふふん……。", "「……え？」", "女性の指が止まりかけた。", "外から聞こえる鼻歌。", "聞き間違いだろうか。", "そんなはずはない。", "あの鼻歌を歌う人は、もういないはずなのに。", "女性は、もう一度鍵盤に指を置いた。", "すると——", "ふん、ふふん……。", "鼻歌が、ピアノの旋律に重なった。"]}, {"img": "img22.webp", "alt": "扉を開ける女性", "lines": ["女性の胸が高鳴った。", "「……まさか」", "そのとき。", "ギィ……。", "音楽堂の扉が、ゆっくりと開いた。"]}, {"img": "img23.webp", "alt": "扉の向こうの少年", "lines": ["#第五幕　もう一度、会えた", "扉の向こうに立っていたのは——", "小さな男の子だった。", "あの夜と、まったく変わらない姿。", "女性は息をのんだ。", "「……うそ」", "少年も、女性を見つめていた。", "「……あれ？」", "少し首をかしげる。", "「……もしかして」"]}, {"img": "img24.webp", "alt": "口を覆って驚く女性", "lines": ["女性は、ゆっくりと立ち上がった。", "一歩。", "また一歩。", "「……ほんとうに？」", "少年は女性の顔をじっと見つめた。", "そして、目を大きく見開いた。", "「……きみなの？」", "女性の目から、涙がこぼれた。", "「……うん」"]}, {"img": "img25.webp", "alt": "手を握り合う二人", "lines": ["少年が駆け寄った。", "二人は、ぎゅっと手を握り合った。", "「……また、会えた」", "「……うん。会えたね」"]}, {"img": "img26.webp", "alt": "抱き合う二人", "lines": ["少年は不思議そうに女性を見上げた。", "「……なんだか、大きくなったね」", "女性は涙を流しながら笑った。", "「……あなたは、ちっとも変わらないね」", "少年は首をかしげた。", "「……そう？」", "その顔が、あの頃のままで。", "女性は、また泣きながら笑った。", "ずっと会いたかった。", "もう一度、声を聞きたかった。", "もう一度、一緒に笑いたかった。", "その願いが、今、目の前にあった。"]}, {"img": "img27.webp", "alt": "ひとりでに鳴るピアノ", "lines": ["#第六幕　星が返した時間", "そのときだった。", "ポーン。", "誰も触れていないピアノから、音が響いた。", "ポロン、ポロン……。", "鍵盤が、ひとりでに動き始める。", "二人が振り返ると、音楽堂の天井に小さな星が瞬き始めた。", "ひとつ。", "ふたつ。", "やがて、無数の星がゆっくりと降りてくる。", "「……きれい」", "女性がつぶやいた。"]}, {"img": "img28.webp", "alt": "光に包まれる少年", "lines": ["けれど、その星たちが少年の周りを取り囲み始めたとき——", "女性の表情が変わった。", "「……え？」", "あの夜の光。", "あの夜と、同じ輝き。", "少年が消えてしまった、あの瞬間がよみがえる。"]}, {"img": "img29.webp", "alt": "少年の手をつかむ女性", "lines": ["「……待って」", "女性は少年の手を強く握った。", "「ねえ……また光って、消えたりしないよね？」", "星の光が、少しずつ強くなる。", "「ねえ、ちょっと……！」", "少年は不思議そうに女性を見上げた。", "「……どうしたの？」", "「いや……お願い……！」", "女性は少年を引き寄せようとした。", "「もう、どこにも行かないで……！」"]}, {"img": "img30.webp", "alt": "離れていく手", "lines": ["その瞬間。", "まばゆい光が、二人の間にあふれた。", "「……っ！」", "女性は思わず目を閉じた。", "握っていた手が、ふっと離れる。", "「……いやっ！」"]}, {"img": "img31.webp", "alt": "青年になった少年", "lines": ["静寂。", "ピアノの音だけが響いている。", "女性は、恐る恐る目を開けた。", "「……え？」", "そこには——", "ひとりの青年が立っていた。", "青年は、自分の手を見つめている。", "「……あれ？」", "女性は息をのんだ。", "「……あなた？」"]}, {"img": "img32.webp", "alt": "「ぼく、消えてないよ？」", "lines": ["青年が顔を上げる。", "そして、あの頃と同じ笑顔で言った。", "「……ぼく、消えてないよ？」", "女性は一瞬ぽかんとして——", "次の瞬間、泣きながら笑った。", "「……もうっ！　びっくりさせないでよ……！」", "青年も笑った。", "ふと、自分の腕や足を見下ろした。", "「……あれ？　ぼく、大きくなってる？」", "女性は、涙をぬぐいながらうなずいた。", "「……うん。すっごく」", "青年は不思議そうに自分の手を眺めた。", "そして、少し照れくさそうに笑った。", "その笑顔は、あの頃の少年のままだった。"]}, {"img": "img33.webp", "alt": "流れ星を見る二人", "lines": ["青年は、そっと手を差し出した。", "女性は、その手を握った。", "今度こそ、離さないように。", "そのとき。", "音楽堂の大きな窓の向こうを、一筋の流れ星が横切った。", "続いて、もうひとつ。", "そして、またひとつ。", "夜空いっぱいに、星が降り始めた。", "「……すごい」", "青年がつぶやいた。", "女性は星空を見上げた。", "「……音楽堂の奇跡、なのかな」", "青年も空を見上げる。", "「……そうかもしれないね」", "二人は顔を見合わせ、笑った。", "そして、手をつないだまま、星空を眺めていた。"]}, {"img": "img34.webp", "alt": "歌いながら連弾する二人", "lines": ["すると——", "青年が、小さく鼻歌を歌い始めた。", "ふん、ふふん……。", "誰もいないピアノが、その鼻歌に合わせるように静かに鳴り始める。", "ポロン、ポロン……。"]}, {"img": "img35.webp", "alt": "また間違えて笑う二人", "lines": ["女性は、くすっと笑った。", "「……また間違えた」", "青年は驚いて振り返った。", "「えっ！？　今のところ！？」", "「うん。そこ、いつも間違えるよね」", "「ええー！　せっかく弾けるようになったのに！」", "二人は顔を見合わせた。", "そして、声を上げて笑った。"]}, {"img": "img36.webp", "alt": "寄り添う二人", "lines": ["音楽堂の窓の向こうでは、流れ星がいくつも、いくつも夜空を横切っていた。", "あの夜、止まってしまった二人の時間。", "それを再び動かしたのは、", "流れ星と、ひとつのピアノの旋律だったのかもしれない。", "そして今夜。", "二人の物語は、もう一度動き始めた。"]}, {"end": true, "img": "img37.webp", "alt": "星が降る夜の音楽堂と二人"}];
const OPCHAT = "https://line.me/ti/g2/JLE5DC_IjliePPb9tKLrPhVyAReacddikiOvPw?utm_source=invitation&utm_medium=link_copy&utm_campaign=default";

const $ = id => document.getElementById(id);
let page = 0;
const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(dir){
  const p = PAGES[page];
  const img = $("pic");
  const newSrc = "images/"+p.img;
  if(dir && !img.src.endsWith(p.img)){
    const old = img.cloneNode(); old.removeAttribute("id");
    $("stage").appendChild(old);
    old.className = dir>0 ? "slide-out" : "slide-out-r";
    img.src = newSrc;
    img.className = dir>0 ? "slide-in" : "slide-in-r";
    setTimeout(()=>{ old.remove(); img.className=""; },460);
  }else{
    img.src = newSrc;
  }
  img.alt = p.alt || ((page+1)+"ページ目の絵");

  const box = $("text");
  box.scrollTop = 0;
  if(p.end){
    box.className="textbox end";
    box.innerHTML = '<p class="owari">おしまい。</p><p style="line-height:1.9">『星が降る夜のピアニストⅡ<br>〜時を越えた旋律〜』</p><p>作：桜庭ゆわ</p>'+
      '<a class="btn btn-main" style="margin-top:8px;text-decoration:none;display:block;text-align:center" href="'+OPCHAT+'">📚 ゆわの魔法図書館に戻る</a>'+
      '<button class="btn btn-sub" id="again">はじめから読む</button>'+
      '<a class="btn btn-sub" style="text-decoration:none;display:block;text-align:center;color:inherit" href="index.html">ほかの形式で楽しむ</a>';
    $("again").onclick = ()=>{ go(0-page); };
  }else{
    box.className="textbox";
    box.innerHTML = p.lines.map(s=> s[0]==="#"
      ? '<span class="s ch">'+esc(s.slice(1))+'</span>'
      : '<span class="s">'+esc(s)+'</span>').join("");
  }
  $("count").textContent = (page+1)+" / "+PAGES.length;
  $("bar").style.width = ((page+1)/PAGES.length*100)+"%";
  $("prev").disabled = page===0;
  $("next").disabled = page===PAGES.length-1;
  if(PAGES[page+1]){ const pre=new Image(); pre.src="images/"+PAGES[page+1].img; }
}
function go(d){
  const n = page+d;
  if(n<0 || n>=PAGES.length) return;
  page = n;
  render(d>0?1:-1);
}
$("start").onclick = ()=>{
  $("cover").style.display="none";
  $("reader").style.display="flex";
  page = 0; render(0);
};
$("prev").onclick = ()=> go(-1);
$("next").onclick = ()=> go(1);
$("stage").onclick = ()=> go(1);
document.addEventListener("keydown",e=>{
  if($("reader").style.display!=="flex") return;
  if(e.key==="ArrowRight") go(1);
  if(e.key==="ArrowLeft") go(-1);
});
let sx=null, sy=null;
$("reader").addEventListener("touchstart",e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
$("reader").addEventListener("touchend",e=>{
  if(sx===null) return;
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5) go(dx<0?1:-1);
  sx=null;
},{passive:true});
</script>
