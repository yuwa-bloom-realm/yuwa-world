<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>星が降る夜のピアニストⅡ｜紙芝居</title>
<meta name="description" content="桜庭ゆわの短編物語を、絵をめくりながら、文字で読む紙芝居で。">
<meta property="og:title" content="星が降る夜のピアニストⅡ｜紙芝居">
<meta property="og:description" content="桜庭ゆわの短編物語を、絵をめくりながら、文字で読む紙芝居で。">
<meta property="og:image" content="images/img01.webp">
<style>
  :root{
    --paper:#f6efe2;
    --paper2:#efe4cf;
    --ink:#3b2f25;
    --soft:#7a6a58;
    --wood:#8a5a36;
    --wood2:#6e4426;
    --red:#c2557a;
    --hl:#fff3c4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(ellipse at top,#fbf6ec 0%,var(--paper) 55%,var(--paper2) 100%);
    color:var(--ink);
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
    -webkit-tap-highlight-color:transparent;
    overflow:hidden;
  }
  .app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:720px;margin:0 auto;
       padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

  /* ---------- 紙芝居の木枠 ---------- */
  .butai{
    position:relative;border-radius:10px;padding:10px;
    background:linear-gradient(135deg,var(--wood) 0%,var(--wood2) 100%);
    box-shadow:0 6px 18px rgba(60,35,15,.28), inset 0 0 0 2px rgba(255,255,255,.08);
  }
  .butai::before{content:"";position:absolute;inset:4px;border-radius:7px;border:1px solid rgba(255,230,190,.25);pointer-events:none}
  .stage{position:relative;overflow:hidden;border-radius:4px;background:#fdf9f1;aspect-ratio:16/9;max-height:42vh;margin:0 auto}
  .stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fdf9f1}
  .stage img.slide-out{animation:out .45s ease forwards}
  .stage img.slide-in{animation:in .45s ease forwards}
  .stage img.slide-out-r{animation:outr .45s ease forwards}
  .stage img.slide-in-r{animation:inr .45s ease forwards}
  @keyframes out{to{transform:translateX(-105%)}}
  @keyframes in{from{transform:translateX(105%)}to{transform:none}}
  @keyframes outr{to{transform:translateX(105%)}}
  @keyframes inr{from{transform:translateX(-105%)}to{transform:none}}

  /* ---------- 表紙 ---------- */
  #cover{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:18px 4px}
  .label{text-align:center;font-size:12px;letter-spacing:.3em;color:var(--soft)}
  .title{text-align:center;font-size:clamp(22px,6vw,30px);line-height:1.5;letter-spacing:.06em}
  .author{text-align:center;font-size:15px;color:var(--soft);letter-spacing:.2em}
  .btns{display:flex;flex-direction:column;gap:12px;align-items:center}
  .btn{width:min(320px,100%);padding:15px 18px;border-radius:999px;font-size:16px;letter-spacing:.08em;
       transition:transform .1s}
  .btn:active{transform:scale(.97)}
  .btn-main{background:var(--red);color:#fff;box-shadow:0 4px 12px rgba(194,85,122,.3)}
  .btn-sub{background:#fffaf0;border:1px solid #d8c7ab}
  .note{text-align:center;font-size:12px;color:var(--soft);line-height:1.7}

  /* ---------- 読む画面 ---------- */
  #reader{flex:1;display:none;flex-direction:column;min-height:0;gap:10px;padding-top:8px}
  .topbar{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--soft);min-height:38px}
  .topbar .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
  .pill{padding:7px 12px;border-radius:999px;background:#fffaf0;border:1px solid #d8c7ab;font-size:13px;white-space:nowrap}
  .pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .textbox{flex:1;min-height:0;overflow-y:auto;background:rgba(255,252,245,.85);border:1px solid #e3d5bd;border-radius:10px;
           padding:16px 18px;font-size:17px;line-height:2;letter-spacing:.03em;-webkit-overflow-scrolling:touch}
  .textbox .s{display:block;transition:background .3s;border-radius:4px;padding:1px 0}
  .textbox .s.ch{text-align:center;color:var(--red);letter-spacing:.15em;font-size:15px;margin:4px 0 10px}
  .textbox .s.now{background:var(--hl);box-shadow:0 0 0 2px var(--hl)}
  .textbox.end{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px}
  .owari{font-size:22px;letter-spacing:.2em}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:10px}
  .nav button{flex:1;padding:14px 0;border-radius:12px;font-size:16px;background:#fffaf0;border:1px solid #d8c7ab}
  .nav button:disabled{opacity:.35}
  .nav .count{flex:0 0 auto;font-size:14px;color:var(--soft);min-width:64px;text-align:center}
  .progress{height:3px;background:#e8dcc6;border-radius:3px;overflow:hidden}
  .progress i{display:block;height:100%;background:var(--red);width:0;transition:width .4s}
</style>
</head>
<body>
<div class="app">

  <!-- 表紙 -->
  <section id="cover">
    <div class="butai"><div class="stage"><img src="images/img01.webp" alt="表紙"></div></div>
    <div>
      <p class="label">ゆわ魔法図書館の紙芝居</p>
      <h1 class="title">星が降る夜のピアニストⅡ<br><span style="font-size:.6em">〜時を越えた旋律〜</span></h1>
      <p class="author">桜庭ゆわ</p>
    </div>
    <div class="btns">
      <button class="btn btn-main" id="start">🎴 紙芝居をめくる</button>
    </div>
    <p class="note">絵をタップするか、左右にスワイプするとめくれます。<br>音は出ません。自分のペースで、ゆっくりどうぞ。</p>
  </section>

  <!-- 読む画面 -->
  <section id="reader">
    <div class="topbar">
      <span class="t">星が降る夜のピアニストⅡ</span>
      <a class="pill" href="index.html" style="text-decoration:none;color:inherit">ほかの形式</a>
    </div>
    <div class="progress"><i id="bar"></i></div>
    <div class="butai"><div class="stage" id="stage"><img id="pic" alt=""></div></div>
    <div class="textbox" id="text"></div>
    <div class="nav">
      <button id="prev">◀ まえ</button>
      <span class="count" id="count"></span>
      <button id="next">つぎ ▶</button>
    </div>
  </section>

</div>

<script>
// 紙芝居は音声なし（絵と文章だけ）が標準
const PAGES = [{"img": "img02.webp", "alt": "石畳で目を覚ます少年", "lines": ["#第一幕　止まった時計", "冷たい石畳が、頬に触れていた。", "少年は、ゆっくりと目を開けた。", "さっきまで、あの子とピアノを弾いていたはずなのに。", "目の前にあるのは、知らない街の空だった。", "「……ここ、どこ？」"]}, {"img": "img03.webp", "alt": "場面2", "lines": ["身体を起こすと、古い建物がずらりと並んでいた。", "窓辺の花も、道端の看板も、まるで誰かが置き忘れた景色のようだ。", "少年は振り返った。", "けれど、そこに、あの子はいなかった。"]}, {"img": "img04.webp", "alt": "場面3", "lines": ["「……ねえ！」", "声を出しても、返事はない。", "いつもなら聞こえるはずの靴音も、笑い声も、馬車の音も。", "何ひとつ、聞こえなかった。", "街は、息をひそめているようだった。"]}, {"img": "img05.webp", "alt": "十二時で止まった時計塔", "lines": ["広場の向こうに、大きな時計塔が見えた。", "針は、十二時を指している。", "少年は、しばらく見上げていた。", "一秒。二秒。三秒。", "……針は、ぴくりとも動かなかった。", "「時間まで、止まってるの……？」"]}, {"img": "img06.webp", "alt": "場面5", "lines": ["少年は走った。", "角を曲がり、橋を渡り、知らない路地を何度も覗き込んだ。", "「あの子、どこにいるの？」", "返ってくるのは、自分の声だけ。", "あの夜、すぐ隣にいたはずの少女は、どこにもいなかった。"]}, {"img": "img07.webp", "alt": "場面6", "lines": ["#第二幕　誰もいない街のピアノ", "走り疲れて、少年はベンチに腰を下ろした。", "足元の石畳を見つめる。", "もう一度、一緒に弾こうと約束したわけじゃない。", "でも、あの曲は、まだ終わっていなかった気がする。", "「……もう一度、会いたいな」", "その小さな声を、聞いてくれる人はいなかった。"]}, {"img": "img08.webp", "alt": "場面7", "lines": ["そのときだった。", "風も吹いていないのに、少年の胸の奥で、何かがふっと揺れた。", "聞こえたわけではない。", "けれど、確かに、あの旋律の続きを思い出した。", "少年は、顔を上げた。"]}, {"img": "img09.webp", "alt": "場面8", "lines": ["細い路地の奥に、古びた建物があった。", "小さな窓。静かな扉。", "どうしてだろう。", "初めて見る場所なのに、そこへ行かなければならない気がした。", "少年は、ゆっくり歩き出した。"]}, {"img": "img10.webp", "alt": "場面9", "lines": ["扉を開けると、部屋の真ん中に一台のピアノがあった。", "長いあいだ、誰にも弾かれなかったような古いピアノ。", "少年はそっと椅子に座る。", "鍵盤に触れた指先が、少し震えた。", "「……覚えてるかな」"]}, {"img": "img11.webp", "alt": "場面10", "lines": ["ぽろん。", "もう一音。", "ぽろん、ぽん……。", "「あっ。また間違えた！」", "何度弾いても、あの夜のようにはならない。", "少年は鍵盤から手を離した。", "隣で笑ってくれる人がいないだけで、こんなにも難しいなんて。"]}, {"img": "img12.webp", "alt": "二人で弾いた思い出", "lines": ["ふと、まぶたの裏に、あの夜がよみがえった。", "小さな指が、隣で鍵盤を追いかける。", "間違えるたび、顔を見合わせて笑った。", "星が降るような夜だった。", "あの子がいたから、何度間違えても、もう一度弾きたくなった。"]}, {"img": "img13.webp", "alt": "場面12", "lines": ["#第三幕　最後の一音", "少年は、そっと目を開けた。", "間違えないことより、大切なことがあった。", "あの子と、最後まで弾きたかった。", "それだけだった。", "「……もう一度」", "少年は背筋を伸ばし、鍵盤に向き直った。"]}, {"img": "img14.webp", "alt": "場面13", "lines": ["一つ目の音。", "二つ目の音。", "忘れかけていた旋律が、指先に戻ってくる。", "あの子が笑ったところ。二人で息を合わせたところ。", "そして――最後の一音。", "澄んだ響きが、静かな部屋に広がった。", "今度は、間違えなかった。"]}, {"img": "img15.webp", "alt": "動き出す時計の針", "lines": ["かちり。", "少年は顔を上げた。", "もう一度、かちり。", "遠くの時計塔で、止まっていた針が動き出した。", "一秒ずつ。確かに。", "まるで、誰かが街の心臓を、もう一度動かしたようだった。"]}, {"img": "img16.webp", "alt": "場面15", "lines": ["窓から風が吹き込んだ。", "カーテンが舞い、光が床を駆け抜ける。", "静まり返っていた街が、ゆっくり息を吹き返していく。", "少年は思わず目を閉じた。", "まぶたの向こうで、世界そのものが、くるりと回った気がした。"]}, {"img": "img17.webp", "alt": "場面16", "lines": ["光がやわらぐと、目の前には見覚えのある建物が立っていた。", "星空の下の、あの音楽堂。", "少年は、息をのんだ。", "ここだ。", "あの子と一緒に、あの曲を弾いた場所だ。"]}, {"img": "img18.webp", "alt": "場面17", "lines": ["#第四幕　懐かしい鼻歌", "近づこうとしたとき、少年は足を止めた。", "音楽堂の奥から、ピアノの音が聞こえてきたのだ。", "胸が、どきんと鳴る。", "聞き間違えるはずがない。", "それは、二人で弾いた、あの旋律だった。"]}, {"img": "img19.webp", "alt": "場面18", "lines": ["少年の唇が、自然に動いた。", "ふん、ふん、ふふん……。", "覚えていた。", "指が忘れそうになっても、心はずっと覚えていた。", "扉の前で、少年は小さく鼻歌を続けた。"]}, {"img": "img20.webp", "alt": "ピアノを弾く女性", "lines": ["そのころ、音楽堂の中では、一人の女性がピアノを弾いていた。", "少女だったあの日から、どれほどの季節が過ぎただろう。", "背が伸びて、声が変わって、暮らしも変わった。", "それでも、この曲だけは忘れなかった。", "弾くたびに、隣にいた少年の笑い声が、胸の奥でよみがえるから。"]}, {"img": "img21.webp", "alt": "場面20", "lines": ["ふいに、女性の指が止まった。", "ピアノの音に重なる、小さな鼻歌。", "聞き間違いだと思った。", "けれど、その音の運び方も、少しだけはずむところも。", "「……うそ」", "女性は、扉を見つめた。"]}, {"img": "img22.webp", "alt": "場面21", "lines": ["椅子を立つ音が、音楽堂に響いた。", "女性は扉へ駆け寄る。", "開けてしまえば、夢が終わるかもしれない。", "それでも、確かめずにはいられなかった。", "震える手が、扉に触れる。", "そして――ゆっくり、扉が開いた。"]}, {"img": "img23.webp", "alt": "場面22", "lines": ["#第五幕　もう一度、会えた", "そこに立っていたのは、少年だった。", "あの夜と同じ髪。あの夜と同じ瞳。", "少年は、大人になった女性を見上げた。", "「……え？」", "知らない人のはずなのに。", "なぜだろう、その目を、知っている気がした。"]}, {"img": "img24.webp", "alt": "場面23", "lines": ["女性は、両手で口を覆った。", "声にならない。", "何度も夢に見た姿が、今、目の前にいる。", "時はこんなにも過ぎたのに、少年だけが、あの夜のままだった。", "「……ほんとうに？」", "涙の向こうで、少年の目が、少しずつ大きくなった。"]}, {"img": "img25.webp", "alt": "手を握り合う二人", "lines": ["「……きみ、なの？」", "女性は何度もうなずいた。", "二人は、ほとんど同時に手を伸ばした。", "指先が触れた。", "あたたかかった。", "夢じゃない。幻でもない。", "「……会いたかった！」"]}, {"img": "img26.webp", "alt": "場面25", "lines": ["二人は、ぎゅっと抱き合った。", "うれしくて、苦しくて、何から話せばいいのかわからない。", "何年も胸にしまっていた言葉が、涙になってあふれた。", "けれど、今は言葉なんていらなかった。", "ここにいる。", "それだけで、十分だった。"]}, {"img": "img27.webp", "alt": "場面26", "lines": ["#第六幕　星が返した時間", "そのとき。", "ぽろん――。", "二人は顔を上げた。", "誰も触れていないピアノが、ひとりでに鳴り始めたのだ。", "懐かしい旋律が、音楽堂いっぱいに広がっていく。", "星のような光が、鍵盤の上からふわりと舞い上がった。"]}, {"img": "img28.webp", "alt": "場面27", "lines": ["「……えっ？」", "少年が、自分の手を見つめた。", "指先が、淡く光っている。", "光は腕へ、肩へ、ゆっくり広がっていった。", "何が起きているのか、少年にもわからない。", "女性の顔から、笑みが消えた。"]}, {"img": "img29.webp", "alt": "場面28", "lines": ["あの夜の光を、女性は覚えていた。", "少年が、目の前からいなくなったときの光。", "「ねえ……また光って消えないよね？」", "女性は慌てて少年の手をつかんだ。", "「ねえ、ちょっと……！」", "もう二度と、あんな別れは嫌だった。"]}, {"img": "img30.webp", "alt": "場面29", "lines": ["けれど、光はますます強くなった。", "二人は必死に手を伸ばす。", "「待って……！」", "触れていた指が、少しずつ離れていく。", "まぶしさに、女性は思わず顔をそむけた。", "そして、あたりは真っ白になった。"]}, {"img": "img31.webp", "alt": "青年になった少年", "lines": ["やがて、光が静かにほどけていった。", "女性は、そっと目を開けた。", "そこにいたのは――背の高い、一人の青年だった。", "白いシャツ。茶色のベスト。そして、あの懐かしい瞳。", "青年は自分の大きくなった手を見つめた。", "「……え？　ぼく……？」", "女性は、もう一度、両手で口を覆った。"]}, {"img": "img32.webp", "alt": "場面31", "lines": ["青年は、何度も自分の手を開いたり閉じたりした。", "足も、肩も、声さえも、さっきまでとは違う。", "けれど、ここにいる。", "彼女の目の前に、ちゃんと。", "青年は少し照れくさそうに笑った。", "「……ぼく、消えてないよ？」", "女性の目から、今度こそ安心の涙がこぼれた。"]}, {"img": "img33.webp", "alt": "場面32", "lines": ["二人は、並んで星空を見上げた。", "流れ星が、ひとつ。また、ひとつ。", "あの日、少年は時間の向こうに取り残された。", "少女は、一人で季節を重ねてきた。", "けれど今、二人の時計は同じ速さで動いている。", "隣にいる人のぬくもりを、確かめながら。"]}, {"img": "img34.webp", "alt": "場面33", "lines": ["やがて二人は、もう一度ピアノの前に座った。", "四つの手が、そっと鍵盤に触れる。", "最初の一音が響くと、二人は顔を見合わせた。", "懐かしくて、おかしくて、うれしくて。", "今度は、鼻歌まで一緒になった。", "あの夜、途中で終わってしまった曲が、ようやく続きを奏で始めた。"]}, {"img": "img35.webp", "alt": "場面34", "lines": ["ところが――。", "ぽろんっ。", "「あっ！」", "青年が、しまったという顔をした。", "「……また間違えた！」", "女性は一瞬きょとんとして、それから吹き出した。", "青年もつられて笑った。", "あの夜と同じ笑い声が、今度は二人分、音楽堂に響いた。"]}, {"img": "img36.webp", "alt": "場面35", "lines": ["間違えてもいい。", "途中で止まっても、また弾き始めればいい。", "二人は、顔を見合わせて微笑んだ。", "あの旋律は、もう、ひとりぼっちの思い出ではなかった。", "これから何度でも、一緒に奏でていける。"]}, {"img": "img37.webp", "alt": "星が降る夜の音楽堂と二人", "lines": ["音楽堂の明かりが、夜の庭をやさしく照らしていた。", "その前に並んで座る、二人の後ろ姿。", "空には、数えきれないほどの星が流れていた。", "少年だった彼と、少女だった彼女。", "長い時間を越えて、ようやく並んだ二人の明日へ。", "星は、今夜も降り続ける。"]}, {"end": true, "img": "img37.webp", "alt": "おしまい"}];
const OPCHAT = "https://line.me/ti/g2/JLE5DC_IjliePPb9tKLrPhVyAReacddikiOvPw?utm_source=invitation&utm_medium=link_copy&utm_campaign=default";

const $ = id => document.getElementById(id);
let page = 0;
const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(dir){
  const p = PAGES[page];
  const img = $("pic");
  const newSrc = "images/"+p.img;
  if(dir && !img.src.endsWith(p.img)){
    const old = img.cloneNode(); old.removeAttribute("id");
    $("stage").appendChild(old);
    old.className = dir>0 ? "slide-out" : "slide-out-r";
    img.src = newSrc;
    img.className = dir>0 ? "slide-in" : "slide-in-r";
    setTimeout(()=>{ old.remove(); img.className=""; },460);
  }else{
    img.src = newSrc;
  }
  img.alt = p.alt || ((page+1)+"ページ目の絵");

  const box = $("text");
  box.scrollTop = 0;
  if(p.end){
    box.className="textbox end";
    box.innerHTML = '<p class="owari">―― おしまい ――</p><p>桜庭ゆわ</p>'+
      '<a class="btn btn-main" style="margin-top:8px;text-decoration:none;display:block;text-align:center" href="'+OPCHAT+'">📚 ゆわの魔法図書館に戻る</a>'+
      '<button class="btn btn-sub" id="again">はじめから読む</button>'+
      '<a class="btn btn-sub" style="text-decoration:none;display:block;text-align:center;color:inherit" href="index.html">ほかの形式で楽しむ</a>';
    $("again").onclick = ()=>{ go(0-page); };
  }else{
    box.className="textbox";
    box.innerHTML = p.lines.map(s=> s[0]==="#"
      ? '<span class="s ch">'+esc(s.slice(1))+'</span>'
      : '<span class="s">'+esc(s)+'</span>').join("");
  }
  $("count").textContent = (page+1)+" / "+PAGES.length;
  $("bar").style.width = ((page+1)/PAGES.length*100)+"%";
  $("prev").disabled = page===0;
  $("next").disabled = page===PAGES.length-1;
  if(PAGES[page+1]){ const pre=new Image(); pre.src="images/"+PAGES[page+1].img; }
}
function go(d){
  const n = page+d;
  if(n<0 || n>=PAGES.length) return;
  page = n;
  render(d>0?1:-1);
}
$("start").onclick = ()=>{
  $("cover").style.display="none";
  $("reader").style.display="flex";
  page = 0; render(0);
};
$("prev").onclick = ()=> go(-1);
$("next").onclick = ()=> go(1);
$("stage").onclick = ()=> go(1);
document.addEventListener("keydown",e=>{
  if($("reader").style.display!=="flex") return;
  if(e.key==="ArrowRight") go(1);
  if(e.key==="ArrowLeft") go(-1);
});
let sx=null, sy=null;
$("reader").addEventListener("touchstart",e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
$("reader").addEventListener("touchend",e=>{
  if(sx===null) return;
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5) go(dx<0?1:-1);
  sx=null;
},{passive:true});
</script>
</body>
