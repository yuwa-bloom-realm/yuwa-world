<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>本棚・作品一覧｜ゆわの魔法図書館</title>
<meta name="description" content="桜庭ゆわの短編物語、全作品の一覧です。">
<meta property="og:title" content="本棚・作品一覧｜ゆわの魔法図書館">
<meta property="og:description" content="桜庭ゆわの短編物語、全作品の一覧です。">
<style>
  :root{ --bg:#f8f2ea; --ink:#3d3230; --gold:#a8834a; --soft:#8a7670; --line:#e6d9c6; --rose:#c2557a; --wood:#7a5233; }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{ background:radial-gradient(ellipse at top,#fffaf2 0%,var(--bg) 60%,#efe4d3 100%); color:var(--ink); min-height:100vh;
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif; padding:30px 16px 56px; }
  main{max-width:560px;margin:0 auto;}
  .kicker{text-align:center;color:var(--gold);font-size:12px;letter-spacing:.35em;margin-bottom:8px;}
  h1{text-align:center;font-size:27px;font-weight:600;letter-spacing:.14em;margin-bottom:6px;}
  .sub{text-align:center;color:var(--soft);font-size:13px;letter-spacing:.1em;margin-bottom:18px;}
  .legend{display:flex;justify-content:center;gap:14px;font-size:13px;color:var(--soft);margin-bottom:22px;flex-wrap:wrap}
  .shelf-label{font-size:13px;color:var(--gold);letter-spacing:.25em;margin:4px 4px 10px}

  /* 最新作 */
  .new{display:block;text-decoration:none;color:var(--ink);background:#fffdf9;border:1.5px solid var(--rose);border-radius:16px;
    overflow:hidden;box-shadow:0 6px 18px rgba(90,50,40,.14);margin-bottom:30px}
  .new img{width:100%;display:block;aspect-ratio:3/2;object-fit:cover}
  .new .body{padding:14px 16px 16px}
  .badge{display:inline-block;font-size:11px;color:#fff;background:var(--rose);border-radius:999px;padding:2px 9px;letter-spacing:.08em;margin-bottom:6px}
  .new .ttl{font-size:20px;letter-spacing:.08em;margin-bottom:4px}
  .marks{font-size:13px;color:var(--soft);letter-spacing:.05em}

  /* 本棚リスト */
  .list{list-style:none;background:#fffdf9;border:1px solid var(--line);border-radius:14px;overflow:hidden;
    box-shadow:0 3px 12px rgba(90,60,40,.08);border-bottom:6px solid var(--wood)}
  .list li+li{border-top:1px solid var(--line)}
  .list a{display:flex;align-items:center;gap:12px;padding:14px 14px;color:var(--ink);text-decoration:none}
  .list a:active{background:#f6efe3}
  .no{flex:0 0 30px;height:30px;border-radius:50%;background:#f3eadb;color:var(--gold);font-size:13px;
    display:flex;align-items:center;justify-content:center;font-family:Georgia,serif}
  .info{flex:1;min-width:0}
  .info .t{font-size:16px;line-height:1.5;letter-spacing:.04em}
  .info .m{font-size:12px;color:var(--soft);margin-top:2px}
  .arrow{color:#c9b79c;font-size:14px}

  .back{display:block;width:min(320px,100%);margin:34px auto 0;padding:15px;border-radius:999px;background:var(--rose);color:#fff;
    text-align:center;text-decoration:none;letter-spacing:.06em;font-size:15px;box-shadow:0 4px 12px rgba(194,85,122,.3)}
  .foot{text-align:center;color:var(--soft);font-size:12px;margin-top:16px;letter-spacing:.1em}
</style>
</head>
<body>
<main>
  <div class="kicker">ゆわの魔法図書館</div>
  <h1>本棚・作品一覧</h1>
  <p class="sub">読みたい物語をタップしてね☕</p>
  <div class="legend"><span>📖 読む</span><span>▶ 観る</span><span>🎴 めくる</span></div>

  <div class="shelf-label">― 新しく届いた物語 ―</div>
  <div id="newest"></div>

  <div class="shelf-label">― 本棚 ―</div>
  <ul class="list" id="shelf"></ul>

  <a class="back" href="https://line.me/ti/g2/JLE5DC_IjliePPb9tKLrPhVyAReacddikiOvPw?utm_source=invitation&utm_medium=link_copy&utm_campaign=default">📚 ゆわの魔法図書館に戻る</a>
  <p class="foot">桜庭ゆわ</p>
</main>
<script>
// ▼ 新しい物語はここに1行足すだけ（いちばん下が最新作）
const BOOKS = [
  {t:"あと、何回。",                     url:"https://yuwa-bloom-realm.github.io/yuwa-stories/ato-nankai.html",          f:"📖"},
  {t:"最後の日の手紙が来なかった朝",       url:"https://yuwa-bloom-realm.github.io/yuwa-stories/saigo-no-tegami.html",     f:"📖"},
  {t:"一日だけ、撮り直せる写真館",         url:"https://yuwa-bloom-realm.github.io/yuwa-stories/torinaoseru-shashinkan.html", f:"📖"},
  {t:"明日からの宅配便",                   url:"https://yuwa-bloom-realm.github.io/yuwa-stories/ashita-takuhai.html",      f:"📖"},
  {t:"夢を預かる質屋",                     url:"https://yuwa-bloom-realm.github.io/yuwa-stories/yume-shichiya.html",       f:"📖"},
  {t:"人生やり直し課、窓口３番",           url:"https://yuwa-bloom-realm.github.io/yuwa-stories/jinsei-yarinaoshi.html",   f:"📖"},
  {t:"おまけの理由",                       url:"https://yuwa-bloom-realm.github.io/yuwa-stories/omake-no-riyu.html",       f:"📖"},
  {t:"影が先に帰る会社",                   url:"https://yuwa-bloom-realm.github.io/yuwa-stories/kage-saki-kaeru.html",     f:"📖"},
  {t:"年賀状じまい、受理されませんでした", url:"https://yuwa-bloom-realm.github.io/yuwa-stories/nengajo-jimai.html",       f:"📖"},
  {t:"私の人生に、私がいなかった",         url:"https://yuwa-bloom-realm.github.io/yuwa-stories/watashi-inakatta.html",    f:"📖"},
  {t:"返品できない宅配便",                 url:"https://yuwa-bloom-realm.github.io/yuwa-world/henpin-dekinai-takuhai/",    f:"📖"},
  {t:"レディーファースト",                 url:"https://yuwa-bloom-realm.github.io/yuwa-world/lady-first/",                f:"📖 ▶ 🎴", cover:"https://yuwa-bloom-realm.github.io/yuwa-world/lady-first/images/img01.webp", lead:"68歳のあきこが、喫茶店のドアの前で思いがけず「レディ」と呼ばれた日のお話。"},
  {t:"ちょっと余計な自動販売機",           url:"https://yuwa-bloom-realm.github.io/yuwa-world/yokeina-jihanki/",           f:"📖 ▶ 🎴", cover:"https://yuwa-bloom-realm.github.io/yuwa-world/yokeina-jihanki/images/img01.webp", lead:"コーヒーを買いたいだけなのに、なぜか余計なものばかり出てくる赤い自販機のお話。"},
  {t:"星が降る夜のピアニスト",             url:"https://yuwa-bloom-realm.github.io/yuwa-world/hoshi-pianist/",             f:"📖 ▶ 🎴", cover:"https://yuwa-bloom-realm.github.io/yuwa-world/hoshi-pianist/images/img01.webp", lead:"母を亡くしてピアノを弾かなくなった少女が、丘の上の音楽堂で、ふしぎな少年に出会うお話。"},
  {t:"星が降る夜のピアニストⅡ 〜時を越えた旋律〜", url:"https://yuwa-bloom-realm.github.io/yuwa-world/hoshi-pianist-2/",           f:"📖 🎴", cover:"https://yuwa-bloom-realm.github.io/yuwa-world/hoshi-pianist-2/images/img01.webp", lead:"光に包まれて消えた少年が目を覚ますと、そこは時計の止まった、誰もいない街だった。"}
];

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const n = BOOKS.length, last = BOOKS[n-1];
document.getElementById("newest").innerHTML =
  '<a class="new" href="'+last.url+'">' +
  (last.cover ? '<img src="'+last.cover+'" alt="『'+esc(last.t)+'』">' : '') +
  '<div class="body"><span class="badge">NEW　'+n+'冊目</span>' +
  '<div class="ttl">『'+esc(last.t)+'』</div>' +
  (last.lead ? '<div class="marks" style="margin-bottom:6px;color:var(--ink);line-height:1.8">'+esc(last.lead)+'</div>' : '') +
  '<div class="marks">'+last.f+'</div></div></a>';

document.getElementById("shelf").innerHTML = BOOKS.map((b,i) =>
  '<li><a href="'+b.url+'"><span class="no">'+(i+1)+'</span>' +
  '<span class="info"><div class="t">『'+esc(b.t)+'』</div><div class="m">'+b.f+'</div></span>' +
  '<span class="arrow">›</span></a></li>'
).join("");
</script>
</body>
</html>
